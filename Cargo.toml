[workspace]
resolver = "2"
members = [
    "crates/bouquet",
    "bouquet-py",
]

# Shared release profile — both crates build with the same optimization
# settings so benches and Python wheels measure the same code.
[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"   # symbols for profiling without bloating the wheel
