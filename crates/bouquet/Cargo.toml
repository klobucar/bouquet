[package]
name = "bouquet"
version.workspace = true
edition = "2021"
rust-version = "1.95"
description = "Pluggable Bloom filters: pick your blooms (classical, atomic, more to come)."
license = "MIT"
repository = "https://github.com/klobucar/bouquet"
keywords = ["bloom", "filter", "probabilistic", "no_std", "concurrent"]
categories = ["data-structures", "no-std", "concurrency"]
readme = "../../README.md"

[features]
default = ["std", "classical"]
std = []
classical = []
atomic = ["dep:portable-atomic"]
blocked = []
simd = ["blocked"]
serde = ["dep:serde"]
loom = ["dep:loom"]

[dependencies]
libm = "0.2"
siphasher = { version = "1.0", default-features = false }
portable-atomic = { version = "1", default-features = false, optional = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"], optional = true }
loom = { version = "0.7", optional = true }

[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = { version = "1", default-features = false, features = ["fallback"], optional = true }

[dev-dependencies]
proptest = "1"
fastbloom = "0.17"
criterion = { version = "0.8", default-features = false, features = ["html_reports"] }
serde_json = "1"
ciborium = "0.2"
rand = "0.10"
foldhash = "0.2"
# default-features off: the default `heapless-cas` feature pulls in heapless 0.7
# and atomic-polyfill, both carrying RustSec advisories, for no benefit here.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }

[[bench]]
name = "classical"
harness = false

[[bench]]
name = "atomic"
harness = false
required-features = ["atomic"]

[[bench]]
name = "blocked"
harness = false
required-features = ["simd"]

[lib]
name = "bouquet"
path = "src/lib.rs"

[package.metadata.docs.rs]
# NOT `all-features = true`: `serde` and `loom` are mutually exclusive (see
# the compile_error! in lib.rs), so an all-features build fails outright and
# docs.rs would never publish. List the documented set explicitly instead.
features = ["std", "classical", "atomic", "blocked", "simd", "serde"]
rustdoc-args = ["--cfg", "docsrs"]
