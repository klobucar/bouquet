version: 2

updates:
  # SHA-pinned actions do not float, which is the point — but it also means
  # nothing gets security fixes without something bumping them. Dependabot
  # rewrites both the SHA and the `# vX.Y.Z` trailing comment, so the pins
  # stay both current and readable.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # For this action the `@rev` selects the Rust toolchain (`@stable`,
      # `@nightly`, `@1.95.0`), not an action release. Dependabot reads the
      # MSRV pin as an action version and "upgrades" it to a Rust release
      # that does not exist yet, which breaks the MSRV job. The MSRV is
      # bumped by hand, together with `rust-version` in Cargo.toml.
      - dependency-name: "dtolnay/rust-toolchain"

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # One PR for the routine churn; majors still come through separately
      # so an MSRV-breaking bump is never buried in a batch.
      minor-and-patch:
        update-types: ["minor", "patch"]

  # `uv.lock` lives in bouquet-py, not the workspace root.
  - package-ecosystem: uv
    directory: "/bouquet-py"
    schedule:
      interval: weekly
    groups:
      python-dev:
        patterns: ["*"]
