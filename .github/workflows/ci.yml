name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. No job here writes to the repo; a job that
# needs more should ask for it locally rather than widening this.
permissions:
  contents: read

# Superseded pushes to the same ref stop burning runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # loom and serde are mutually exclusive (compile_error in lib.rs); we
        # cover them as separate matrix entries instead of --all-features.
        features:
          - ""
          - "atomic,serde"
          - "blocked,simd"
          - "loom,atomic"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: clippy (rust core)
        env:
          FEATURES: ${{ matrix.features }}
        run: cargo clippy -p bouquet --no-default-features --features "std,classical,$FEATURES" --all-targets

  clippy-py:
    name: clippy (bouquet-py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy -p bouquet-py --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: default
            flags: ""
          - profile: full
            flags: "--features atomic,serde,blocked,simd"
          - profile: nostd-classical
            flags: "--no-default-features --features classical"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo test
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          # $FLAGS is deliberately unquoted: it expands to several arguments.
          # shellcheck disable=SC2086
          cargo test -p bouquet $FLAGS

  # The default ubuntu runner compiles the scalar fallback only, so without
  # this leg every `unsafe` block in the AVX2 path is never even type-checked.
  test-avx2:
    name: test (x86_64 + AVX2)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings -C target-feature=+avx2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p bouquet --features atomic,serde,blocked,simd

  # ...and this one compiles the NEON path.
  test-aarch64:
    name: test (aarch64 + NEON)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p bouquet --features atomic,serde,blocked,simd

  # 32-bit target: catches usize/u64 assumptions in the index derivation and
  # the sizing math that a 64-bit-only matrix cannot.
  test-32bit:
    name: test (i686)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cargo test -p bouquet --target i686-unknown-linux-gnu --features atomic,serde,blocked,simd

  miri:
    name: miri
    runs-on: ubuntu-latest
    env:
      # The blocked backends index with `get_unchecked` and the SIMD backend
      # casts `*const Cell<u64>` to `*mut u64`. Miri is the only thing in CI
      # that actually checks those are sound.
      MIRIFLAGS: -Zmiri-strict-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo miri test -p bouquet --features atomic,serde,blocked --lib
      # Miri does execute the AVX2 intrinsics (and NEON on aarch64), so run
      # the backend tests with the SIMD path compiled in. `backend::` keeps
      # this to ~1 min; the full lib suite under SIMD takes far longer.
      - name: miri (AVX2 SIMD path)
        env:
          RUSTFLAGS: -C target-feature=+avx2
        run: cargo miri test -p bouquet --features atomic,serde,blocked,simd --lib -- backend

  docs:
    name: docs (docs.rs config)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Mirrors `[package.metadata.docs.rs] features`. Deliberately NOT
      # `--all-features`: that combination cannot compile, and getting this
      # wrong means docs.rs silently fails to publish any documentation.
      - run: cargo doc -p bouquet --no-deps --features std,classical,atomic,blocked,simd,serde
      - run: cargo test -p bouquet --doc --features std,classical,atomic,blocked,simd,serde

  msrv:
    name: MSRV 1.95
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Build *and test* — an MSRV that compiles but miscompiles is not an
      # MSRV. Cover bouquet-py too, so a binding-side MSRV break is caught.
      - run: cargo test -p bouquet --features atomic,serde,blocked,simd
      - run: cargo build -p bouquet-py

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Run `cargo audit` directly rather than through rustsec/audit-check.
      # That action reports by creating a check run, which needs
      # `checks: write`; GitHub withholds write tokens from fork PRs, so it
      # fails for outside contributors no matter what we grant. The CLI only
      # reads Cargo.lock, needs no token, and fails the job on any
      # vulnerability. Unmaintained / yanked crates are warnings, printed in
      # the log, and do not fail it. Pinned so a new release cannot change
      # the result of an unrelated run.
      - name: install cargo-audit
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: cargo audit
        run: cargo audit

  # Static analysis of the workflows themselves: catches unpinned actions,
  # credential persistence, cache poisoning, and expression injection. The
  # release workflows publish immutable artifacts, so a regression here is
  # not recoverable after the fact.
  zizmor:
    name: zizmor (workflow audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uvx zizmor --config .github/zizmor.yml .github/workflows/

  loom:
    name: loom
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg loom -D warnings
      LOOM_MAX_PREEMPTIONS: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Run only the loom test binary so the std-thread integration tests
      # don't get accidentally instrumented under loom's atomics.
      - run: cargo test -p bouquet --features loom,atomic --test loom_atomic --release

  bench-dry-run:
    name: bench compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo bench -p bouquet --no-run --features simd,atomic

  python:
    name: bouquet-py (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13", "3.14"]
        # One wheel serves every version (abi3-py311), so the full cross
        # product buys little. Test the version floor everywhere, and the
        # newest interpreter on Linux.
        exclude:
          - { os: macos-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.13" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bouquet-py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      # `--locked` is the point: pyproject sets `exclude-newer = "1 week"` so
      # a freshly published (or freshly compromised) release cannot enter the
      # lockfile without ageing first. Installing with bare `pip install`
      # here would bypass both the lockfile and that cooldown entirely.
      - name: sync locked dev environment
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv sync --locked --python "$PYTHON_VERSION"
      - name: build extension
        run: uv run --no-sync maturin develop --release
      - name: pytest
        run: uv run --no-sync pytest -v
      - name: ruff
        run: uv run --no-sync ruff check .
      - name: ruff format
        run: uv run --no-sync ruff format --check .
      - name: ty
        run: uv run --no-sync ty check
