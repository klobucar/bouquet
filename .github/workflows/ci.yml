name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # loom and serde are mutually exclusive (compile_error in lib.rs); we
        # cover them as separate matrix entries instead of --all-features.
        features:
          - ""
          - "atomic,serde"
          - "blocked,simd"
          - "loom,atomic"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (rust core)
        env:
          FEATURES: ${{ matrix.features }}
        run: cargo clippy -p bouquet --no-default-features --features "std,classical,$FEATURES" --all-targets

  clippy-py:
    name: clippy (bouquet-py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p bouquet-py --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: default
            flags: ""
          - profile: full
            flags: "--features atomic,serde,blocked,simd"
          - profile: nostd-classical
            flags: "--no-default-features --features classical"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        env:
          FLAGS: ${{ matrix.flags }}
        run: cargo test -p bouquet $FLAGS

  msrv:
    name: MSRV 1.95
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p bouquet --features atomic,serde,blocked,simd

  loom:
    name: loom
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg loom -D warnings
      LOOM_MAX_PREEMPTIONS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Run only the loom test binary so the std-thread integration tests
      # don't get accidentally instrumented under loom's atomics.
      - run: cargo test -p bouquet --features loom,atomic --test loom_atomic --release

  bench-dry-run:
    name: bench compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p bouquet --no-run --features simd,atomic

  python-wheel:
    name: bouquet-py wheel + pytest
    # Path-filtered: skip when only the Rust core or docs change.
    if: |
      contains(toJSON(github.event.commits.*.modified), 'bouquet-py/')
      || contains(toJSON(github.event.commits.*.modified), 'crates/bouquet/src/')
      || contains(toJSON(github.event.commits.*.modified), 'crates/bouquet/Cargo.toml')
      || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install maturin + pytest
        run: pip install maturin pytest
      - name: maturin develop
        working-directory: bouquet-py
        run: maturin develop --release
      - name: pytest
        working-directory: bouquet-py
        run: pytest -v
