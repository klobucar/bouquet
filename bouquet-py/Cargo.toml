[package]
name = "bouquet-py"
version.workspace = true
edition = "2021"
rust-version = "1.95"
description = "Python bindings for the bouquet pluggable Bloom filter library."
license = "MIT"
repository = "https://github.com/klobucar/bouquet"
readme = "README.md"
publish = false  # PyPI only; not published to crates.io.

[lib]
# `import bouquet` from Python loads the cdylib produced by this crate. The
# package name on Cargo's side is `bouquet-py` so it doesn't collide with the
# `bouquet` rlib in the workspace.
name = "bouquet"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }
bouquet = { path = "../crates/bouquet", default-features = false, features = ["std", "classical", "atomic", "blocked", "serde"] }
# Encoding for `to_bytes` / `from_bytes`. default-features off for the same
# reason as in the core crate's dev-dependencies: the default `heapless-cas`
# feature pulls in crates carrying RustSec advisories.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }

[build-dependencies]
pyo3-build-config = "0.30"
